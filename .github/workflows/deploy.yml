name: Test and deploy HesabCheck
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hesabcheck-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hesabcheck_test
          POSTGRES_USER: hesabcheck_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hesabcheck_test -d hesabcheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: hesabcheck_test
      POSTGRES_USER: hesabcheck_test
      POSTGRES_PASSWORD: ci-only-password
      DJANGO_DEBUG: '1'
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Validate migrations and tests against PostgreSQL
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          python manage.py test
          python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
      - name: Check production configuration
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-not-used-in-production-1a84e396-50ef-4c66-9f60-517dafbc2a9a
          DJANGO_ALLOWED_HOSTS: hesabcheck.testgrelo.online
          CSRF_TRUSTED_ORIGINS: https://hesabcheck.testgrelo.online
        run: python manage.py check --deploy --fail-level WARNING
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://hesabcheck.testgrelo.online/api/docs/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build immutable image and source bundle
        run: |
          docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "hesabcheck:$GITHUB_SHA" .
          mkdir -p "$RUNNER_TEMP/bundle"
          docker save "hesabcheck:$GITHUB_SHA" -o "$RUNNER_TEMP/bundle/image.tar"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/bundle/source.tar.gz"
          tar -czf "$RUNNER_TEMP/deploy.tar.gz" -C "$RUNNER_TEMP/bundle" image.tar source.tar.gz
      - name: Deploy over restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          ssh -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/deploy.tar.gz"
      - name: Verify HTTPS and deployed commit
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --max-time 20 https://hesabcheck.testgrelo.online/health/ -o /tmp/health.json
          python - <<'PY'
          import json, os
          with open('/tmp/health.json') as stream:
              result = json.load(stream)
          assert result['status'] == 'ok', result
          assert result['release'] == os.environ['GITHUB_SHA'], result
          print('HTTPS health check passed for', result['release'])
          PY
          curl --fail --silent --show-error --max-time 20 https://hesabcheck.testgrelo.online/api/docs/ -o /dev/null
