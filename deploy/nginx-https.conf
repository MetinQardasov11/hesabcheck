# Replace only the existing hesabcheck.testgrelo.online HTTPS server block.
server {
    listen 443 ssl;
    server_name hesabcheck.testgrelo.online;
    ssl_certificate /etc/letsencrypt/live/hesabcheck.testgrelo.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hesabcheck.testgrelo.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 12m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $hesabcheck_upstream hesabcheck-web:8000;
        proxy_pass http://$hesabcheck_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 660s;
        proxy_read_timeout 660s;
    }
}
